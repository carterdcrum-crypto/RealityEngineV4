          ''', 1)
          hero = '        root.addView(incomingHeroAvatar, LinearLayout.LayoutParams(118.dp(), 118.dp()).apply { setMargins(0, 3.dp(), 0, 8.dp()) })\n'
          if hero not in text: raise SystemExit('CallActivity hero marker missing')
          text = text.replace(hero, hero + '''
