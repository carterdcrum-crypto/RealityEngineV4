          pattern = re.compile(r'    private fun renderTranscript\(snapshot: LiveTranscriptState\.State\) \{.*?\n    \}\n\n    private fun renderCoach', re.S)
          text, n = pattern.subn('''    private fun renderTranscript(snapshot: LiveTranscriptState.State) {
                  if (!::transcript.isInitialized) return
                  transcript.render(snapshot)
              }

              private fun renderCoach''', text, count=1)
          if n != 1: raise SystemExit('renderTranscript replacement failed')
          text = text.replace('ResponseCoachState.Phase.KEY_REQUIRED -> "GROQ KEY REQUIRED\\nOpen Settings → Groq"', 'ResponseCoachState.Phase.KEY_REQUIRED -> "AI PROVIDER REQUIRED\\nOpen Settings → Coach provider"', 1)
          pattern = re.compile(r'    private fun renderGroqUsage\(snapshot: ResponseCoachState\.Snapshot\) \{.*?\n    \}\n\n    private fun shortGroqModel', re.S)
          text, n = pattern.subn('''    private fun renderGroqUsage(snapshot: ResponseCoachState.Snapshot) {
                  if (!::groqUsage.isInitialized) return
                  val provider = snapshot.provider.ifBlank { CallSessionHealthState.snapshot().coachProvider }.ifBlank { "WAITING" }
