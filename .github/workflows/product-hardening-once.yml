          path = 'app/src/main/java/com/realityengine/v4/ResponseCoachState.kt'
          replace_once(path,
          '''        val groqModel: String = "",
                  val groqRemainingTokens: Int? = null,''',
          '''        val groqModel: String = "",
                  val provider: String = "",
