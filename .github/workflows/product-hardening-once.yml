                  snapshot = snapshot.copy(''')
          replace_once(path,
          '''    @Synchronized fun publishError(message: String) {
                  snapshot = snapshot.copy(
                      best = null,
                      alternatives = emptyList(),''',
          '''    @Synchronized fun publishError(message: String) {
                  CallSessionHealthState.markCoachError(message)
                  snapshot = snapshot.copy(''')

          # Coach: preserve old cards while refreshing, report measured provider/latency, and throttle optional refreshes when hot.
