name: Product hardening patch runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix patch script quoting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/product_hardening_patch.py')
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if 'callerTurnsSinceAnalysis < settings.analysisFrequencyTurns' in line and 'requiredTurns' not in line:
                  lines[i] = "    '''                callerTurnsSinceAnalysis < settings.analysisFrequencyTurns -> {"
                  lines[i + 1] = "                    status = ResponseCoachState.Phase.LISTENING to \"Caller turn $callerTurnsSinceAnalysis/${settings.analysisFrequencyTurns}\"''',"
              elif 'callerTurnsSinceAnalysis < requiredTurns' in line:
                  lines[i] = "    '''                callerTurnsSinceAnalysis < requiredTurns -> {"
                  lines[i + 1] = "                    status = ResponseCoachState.Phase.LISTENING to \"Caller turn $callerTurnsSinceAnalysis/$requiredTurns\"''',"
              elif 'status.text = \"NEW MEMORY READY · REVIEW SAVE / IGNORE\"\"\"\"' in line:
                  for j in range(i - 1, max(-1, i - 8), -1):
                      if '"""                if (learned.summary.isNotBlank())' in lines[j]:
                          lines[j] = lines[j].replace('"""', "'''", 1)
                          break
                  lines[i] = line.replace('""""', "\"'''", 1)
          p.write_text('\n'.join(lines) + '\n')
          PY
          python3 -m py_compile .github/scripts/product_hardening_patch.py
      - name: Apply product hardening patch
        run: python3 .github/scripts/product_hardening_patch.py
      - name: Commit integrated product hardening
        run: |
          rm -f .github/workflows/product-hardening-once.yml
          rm -f .github/workflows/product-hardening-finalize.yml
          rm -f .github/workflows/product-hardening-run.yml
          rm -f .github/scripts/product_hardening_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate full product hardening pass"
          git push
