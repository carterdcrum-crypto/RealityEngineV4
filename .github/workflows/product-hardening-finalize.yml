name: Product hardening finalizer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tolerant integration patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('app/src/main/java/com/realityengine/v4')

          def get(name):
              return (ROOT / name).read_text()

          def put(name, text):
              (ROOT / name).write_text(text)

          def required_replace(name, old, new, label):
              text = get(name)
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found in {name}')
              put(name, text.replace(old, new, 1))

          def required_regex(name, pattern, replacement, label, flags=0):
              text = get(name)
              text2, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: regex matched {count} times in {name}')
              put(name, text2)

