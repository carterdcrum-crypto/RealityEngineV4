name: Chat APK Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore updater signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download updater-signing-key --pattern realityengine-updater.jks --clobber
      - name: Build debug APK
        shell: bash
        run: GITHUB_RUN_NUMBER=716 gradle --no-daemon assembleDebug --stacktrace --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealityEngineV4-chat-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
