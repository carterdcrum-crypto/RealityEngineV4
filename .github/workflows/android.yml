name: Reality Engine V4 Android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build-diagnostics/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # SOUND_BOARD_BOOTSTRAP_START
      - name: Restore soundboard integration
        shell: bash
        run: |
          set -e
          if [ -f .github/scripts/restore_soundboard.py ]; then
            python3 .github/scripts/restore_soundboard.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Restore managed in-call soundboard"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      # SOUND_BOARD_BOOTSTRAP_END
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify Gradle
        run: gradle --version
      - name: Restore updater signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -f realityengine-updater.jks
          if gh release download updater-signing-key --pattern realityengine-updater.jks --clobber >/dev/null 2>&1; then
            echo "Restored persistent updater signing key"
          else
            keytool -genkeypair -v -keystore realityengine-updater.jks -storepass realityengine-local -alias realityengine -keypass realityengine-local -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Reality Engine, OU=Android, O=Reality Engine, L=Sioux City, ST=Iowa, C=US"
            gh release create updater-signing-key realityengine-updater.jks --title "Reality Engine updater signing key" --notes "Persistent CI signing key. Do not delete or replace this release asset." --prerelease
            echo "Created persistent updater signing key"
          fi
      - name: Initialize diagnostics
        shell: bash
        run: |
          rm -rf build-diagnostics/current
          mkdir -p build-diagnostics/current
          printf 'commit=%s\nrun_id=%s\nstatus=running\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build-diagnostics/current/summary.txt
      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace --console=plain 2>&1 | tee build-diagnostics/current/assembleDebug.log
      - name: Run unit tests
        id: unit_tests
        if: success()
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon test --stacktrace --console=plain 2>&1 | tee build-diagnostics/current/unit-tests.log
      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "build_outcome=${{ steps.build_apk.outcome }}"
            echo "test_outcome=${{ steps.unit_tests.outcome }}"
          } > build-diagnostics/current/summary.txt
          cp build-diagnostics/current/summary.txt build-diagnostics/summary.txt
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealityEngineV4-build-diagnostics-${{ github.sha }}
          path: build-diagnostics/current/
          if-no-files-found: warn
          retention-days: 30
      - name: Save failed diagnostics in repository
        if: failure()
        shell: bash
        run: |
          set -e
          target="build-diagnostics/by-commit/${GITHUB_SHA}"
          mkdir -p "$target"
          cp -f build-diagnostics/current/summary.txt "$target/summary.txt"
          [ ! -f build-diagnostics/current/assembleDebug.log ] || cp -f build-diagnostics/current/assembleDebug.log "$target/assembleDebug.log"
          [ ! -f build-diagnostics/current/unit-tests.log ] || cp -f build-diagnostics/current/unit-tests.log "$target/unit-tests.log"
          cp -f build-diagnostics/current/summary.txt build-diagnostics/summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-diagnostics/summary.txt "$target"
          git diff --cached --quiet && exit 0
          git commit -m "ci: diagnostics for ${GITHUB_SHA} [skip ci]"
          git push
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealityEngineV4-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish latest updater APK
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" RealityEngineV4-latest.apk
          version_code="$GITHUB_RUN_NUMBER"
          version_name="0.${GITHUB_RUN_NUMBER}.0"
          build_id="RE4-W${GITHUB_RUN_NUMBER}"
          printf '{"versionCode":%s,"versionName":"%s","buildId":"%s","commit":"%s"}\n' "$version_code" "$version_name" "$build_id" "$GITHUB_SHA" > update.json
          if gh release view updater-latest >/dev/null 2>&1; then
            gh release upload updater-latest RealityEngineV4-latest.apk update.json --clobber
          else
            gh release create updater-latest RealityEngineV4-latest.apk update.json --title "Reality Engine latest build" --notes "Automatically updated after a green main build."
          fi
