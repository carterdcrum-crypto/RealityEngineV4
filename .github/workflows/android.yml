name: Reality Engine V4 Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Gradle
        run: gradle --version

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          mkdir -p build-diagnostics
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace --console=plain 2>&1 | tee build-diagnostics/assembleDebug.log

      - name: Run unit tests
        id: unit_tests
        if: success()
        shell: bash
        run: |
          mkdir -p build-diagnostics
          set -o pipefail
          gradle --no-daemon test --stacktrace --console=plain 2>&1 | tee build-diagnostics/unit-tests.log

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          mkdir -p build-diagnostics
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "build_outcome=${{ steps.build_apk.outcome }}"
            echo "test_outcome=${{ steps.unit_tests.outcome }}"
          } > build-diagnostics/summary.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealityEngineV4-build-diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealityEngineV4-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
